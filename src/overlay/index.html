<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clip Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: Inter, 'Segoe UI', sans-serif;
    }

    .slot {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .slot.active { opacity: 1; }
    .slot video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #overlay-info {
      position: absolute;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    #overlay-info.visible { opacity: 1; transform: translateY(0); }

    #overlay-info.bottom-left  { bottom: 0; left: 0; }
    #overlay-info.bottom-right { bottom: 0; right: 0; text-align: right; }
    #overlay-info.top-left     { top: 0; left: 0; }
    #overlay-info.top-right    { top: 0; right: 0; text-align: right; }

    #overlay-info.size-compact { padding: 1.5vh 2vw 2vh; width: 28vw; max-width: 45%; }
    #overlay-info.size-normal  { padding: 2vh 2.5vw 2.5vh;   width: 40vw; max-width: 65%; }
    #overlay-info.size-large   { padding: 2.5vh 3.5vw 3vh;   width: 58vw; max-width: 85%; }

    #clip-title {
      color: #fff;
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #clip-meta {
      color: #ccc;
      font-weight: 400;
      line-height: 1.4;
      margin-top: 3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #clip-meta:empty { display: none; }
    #clip-meta .creator { color: #9146FF; font-weight: 600; }
  </style>
</head>
<body>
  <div id="slot-a" class="slot">
    <video id="video-a" playsinline></video>
  </div>
  <div id="slot-b" class="slot">
    <video id="video-b" playsinline></video>
  </div>

  <div id="overlay-info" class="bottom-left size-normal">
    <div id="clip-title"></div>
    <div id="clip-meta"></div>
  </div>

  <script>
    const API = 'http://localhost:1102'
    const info    = document.getElementById('overlay-info')
    const titleEl = document.getElementById('clip-title')
    const metaEl  = document.getElementById('clip-meta')

    const slots = [
      { wrap: document.getElementById('slot-a'), video: document.getElementById('video-a') },
      { wrap: document.getElementById('slot-b'), video: document.getElementById('video-b') }
    ]

    // Per-collection queues: { [collectionId]: shuffledClips[] }
    let colQueues    = {}
    let colIndices   = {}
    let recentlyPlayed = new Map() // clipId -> timestamp
    let recentChannelHistory = []  // [{ch, time}] for distribution balance
    // Persistent per-collection played-this-cycle sets. Survives reloads/restarts so
    // "Show every clip before repeating" holds even when the source goes away.
    let playedCycle = {} // { [collectionId]: Set<clipId> }
    const PLAYED_CYCLE_KEY = 'twclip.playedCycle.v1'
    const RECENT_PLAYED_KEY = 'twclip.recentlyPlayed.v1'
    try {
      const raw = localStorage.getItem(PLAYED_CYCLE_KEY)
      if (raw) {
        const obj = JSON.parse(raw)
        for (const [k, arr] of Object.entries(obj)) playedCycle[k] = new Set(arr)
      }
    } catch {}
    try {
      const raw = localStorage.getItem(RECENT_PLAYED_KEY)
      if (raw) {
        const arr = JSON.parse(raw)
        for (const [id, ts] of arr) recentlyPlayed.set(id, ts)
      }
    } catch {}
    function savePlayedCycle() {
      try {
        const obj = {}
        for (const [k, s] of Object.entries(playedCycle)) obj[k] = [...s]
        localStorage.setItem(PLAYED_CYCLE_KEY, JSON.stringify(obj))
      } catch {}
    }
    function saveRecentlyPlayed() {
      try { localStorage.setItem(RECENT_PLAYED_KEY, JSON.stringify([...recentlyPlayed])) } catch {}
    }
    let currentGame = null         // game the streamer is currently live with
    let currentStreamTitle = null  // stream title for Auto mode rule matching
    let playCfg      = { mode: 'single', activeCollectionId: 'main', weightedSets: [], collections: [] }
    let activeSlot   = 0
    let activeClipId = null
    let nextPreload  = null   // Promise<{clip, slotIdx}|null>
    let overlayTimer = null
    let started      = false
    let wsRef        = null
    let activeClip   = null
    let activeCollectionId = null  // Track which collection the current clip belongs to

    // OBS reroute_audio captures the HTML video element's native audio output directly.
    // createMediaElementSource() disconnects that pipeline and routes through Web Audio,
    // which OBS cannot capture — so we must never use Web Audio API in this overlay.
    function applyVolume(slotIdx, vol) {
      const v = Number(vol)
      slots[slotIdx].video.volume = Math.min(1, Math.max(0, isNaN(v) ? 1 : v))
    }

    // Base gain before the envelope — mirrors getBaseVolume() in
    // src/renderer/src/lib/loudness.js so OBS matches the in-app player.
    // Auto-normalize is baked into the envelope, so there is no extra factor.
    // Note: no Web Audio here (see above), so a combined gain >1 clamps to 1.0.
    function baseVolume(clip) {
      return clip?.volume ?? 1
    }

    let config = {
      showOverlay: true,
      position: 'bottom-left',
      fontSize: 20,
      cardSize: 'normal',
      displayMode: 'timed',
      displayDuration: 8,
      showTitle: true,
      showBroadcaster: true,
      showCreator: true,
      showViews: false,
      showDate: false,
      showDuration: false,
      forceProper: false,
      keepCaps: false,
      biasPopular: false,
      biasRecent: false,
      channelWeights: {},
      playAllBeforeLoop: true,
      selectionWeights: null,
    }

    function getSelWeights() {
      const sw = config.selectionWeights
      if (!sw) {
        // Full legacy fallback
        return {
          avoidReplays: 6,
          respectDistribution: 5,
          gameMatch: 0,
          popularity: config.biasPopular ? 7 : 0,
          clipFreshness: config.biasRecent ? 7 : 0,
        }
      }
      return {
        // New keys (with migration from old key names)
        avoidReplays: sw.avoidReplays ?? Math.min(10, Math.max(1, Math.round((sw.recentlyPlayedCooldownMins ?? 30) / 12))),
        respectDistribution: sw.respectDistribution ?? sw.followingBalance ?? 5,
        gameMatch: sw.gameMatch ?? 0,
        popularity: sw.popularity ?? 0,
        clipFreshness: sw.clipFreshness ?? 0,
      }
    }

    async function fetchCurrentGame() {
      try {
        const res = await fetch(`${API}/api/current-stream`)
        const { game, title } = await res.json()
        currentGame = game ?? null
        currentStreamTitle = title ?? null
      } catch { currentGame = null; currentStreamTitle = null }
    }

    function applyConfig(cfg) {
      const prev = {
        biasPopular: config.biasPopular,
        biasRecent: config.biasRecent,
        channelWeights: config.channelWeights,
        selectionWeights: JSON.stringify(config.selectionWeights),
      }
      const wasVisible = info.classList.contains('visible')
      config = { ...config, ...cfg }
      // Migrate legacy shuffleBias string
      if (cfg.shuffleBias && cfg.shuffleBias !== 'none') {
        if (cfg.shuffleBias === 'popular') config.biasPopular = true
        if (cfg.shuffleBias === 'recent')  config.biasRecent  = true
      }
      info.className = `${config.position} size-${config.cardSize || 'normal'}`
      if (wasVisible) info.classList.add('visible')
      titleEl.style.fontSize = (config.fontSize * 0.1).toFixed(1) + 'vw'
      metaEl.style.fontSize  = (Math.max(8, config.fontSize - 4) * 0.1).toFixed(1) + 'vw'
      info.style.display = config.showOverlay ? '' : 'none'
      const biasChanged = prev.biasPopular !== config.biasPopular || prev.biasRecent !== config.biasRecent
        || prev.selectionWeights !== JSON.stringify(config.selectionWeights)
      const weightsChanged = JSON.stringify(prev.channelWeights) !== JSON.stringify(config.channelWeights)
      if (biasChanged || weightsChanged) loadPlaybackConfig()
      if (activeClip && config.showOverlay) updateClipInfoText(activeClip)
    }

    function shuffle(arr) {
      const a = [...arr]
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]]
      }
      return a
    }

    // Weighted shuffle using exponential-distribution trick.
    // Channel weights control proportion across channels; selection weight factors boost
    // popular/recent clips within each channel. Every clip appears exactly once per cycle.
    function biasedShuffle(clips) {
      const { channelWeights = {} } = config
      const sw = getSelWeights()
      const popW       = (sw.popularity ?? 0) / 10
      const freshW     = (sw.clipFreshness ?? 0) / 10
      const gameMatchW = (sw.gameMatch ?? 0) / 10
      const hasWeights = Object.keys(channelWeights).length > 0
      if (!popW && !freshW && !gameMatchW && !hasWeights || clips.length <= 1) return shuffle(clips)

      const byChannel = {}
      for (const c of clips) {
        const ch = c.broadcaster_name || ''
        ;(byChannel[ch] = byChannel[ch] || []).push(c)
      }

      const activeChannels = Object.keys(byChannel).filter(ch => (channelWeights[ch] ?? 1) > 0)
      const filtered = clips.filter(c => activeChannels.includes(c.broadcaster_name || ''))
      if (filtered.length === 0) return shuffle(clips)
      if (filtered.length <= 1) return filtered

      const totalChW = activeChannels.reduce((s, ch) => s + (channelWeights[ch] ?? 1), 0)

      const playDur = c => Math.max(1, (c.trimEnd ?? c.duration ?? 60) - (c.trimStart ?? 0))
      const scored = filtered.map(clip => {
        const ch = clip.broadcaster_name || ''
        const group = byChannel[ch]
        const chW = channelWeights[ch] ?? 1
        const groupDur = group.reduce((s, c) => s + playDur(c), 0) || 1
        let weight = (chW / totalChW) * (playDur(clip) / groupDur)

        if (popW > 0) {
          const max = Math.max(...group.map(c => c.view_count || 0))
          const norm = max > 0 ? (clip.view_count || 0) / max : 0.5
          weight *= (1 - popW) + popW * norm
        }

        if (freshW > 0) {
          const times = group.map(c => new Date(c.created_at || 0).getTime())
          const max = Math.max(...times), min = Math.min(...times)
          const t = new Date(clip.created_at || 0).getTime()
          const norm = max > min ? (t - min) / (max - min) : 0.5
          weight *= (1 - freshW) + freshW * norm
        }

        if (gameMatchW > 0 && currentGame) {
          if (clip.game_name?.toLowerCase() === currentGame.toLowerCase()) weight *= (1 + gameMatchW)
        }

        return { clip, key: -Math.log(Math.random()) / Math.max(weight, 0.0001) }
      })

      return scored.sort((a, b) => a.key - b.key).map(s => s.clip)
    }

    async function loadPlaybackConfig() {
      try {
        const res = await fetch(`${API}/api/playback-config`)
        const data = await res.json()
        playCfg = data
        const prevIndices = { ...colIndices }
        const prevQueues  = colQueues
        colQueues = {}
        colIndices = {}
        // Preserve recentlyPlayed / recentChannelHistory across reloads so the
        // repeat guards survive queue/config updates.
        for (const col of (data.collections || [])) {
          const clips = col.clips || []
          const prevQ = prevQueues[col.id]
          if (prevQ && prevQ.length) {
            // Stable merge: keep prior order for clips still present, then
            // append newly-added clips. Reshuffling here would break the
            // "play every clip before repeating" round-robin.
            const byId = new Map(clips.map(c => [c.id, c]))
            const kept = prevQ.filter(c => byId.has(c.id)).map(c => byId.get(c.id))
            const keptIds = new Set(kept.map(c => c.id))
            const added = biasedShuffle(clips.filter(c => !keptIds.has(c.id)))
            colQueues[col.id] = [...kept, ...added]
          } else {
            colQueues[col.id] = biasedShuffle(clips)
          }
          colIndices[col.id] = prevIndices[col.id] ?? 0
          // Prune played-cycle entries for clips no longer in this collection.
          const set = playedCycle[col.id]
          if (set) {
            const validIds = new Set(clips.map(c => c.id))
            for (const id of set) if (!validIds.has(id)) set.delete(id)
          }
        }
        savePlayedCycle()
        activeCollectionId = null
      } catch {
        playCfg   = { mode: 'single', activeCollectionId: 'main', weightedSets: [], collections: [] }
        colQueues  = {}
        colIndices = {}
        activeCollectionId = null
      }
    }

    function hasAnyClips() {
      return Object.values(colQueues).some(q => q.length > 0)
    }

    function matchesRule(rule) {
      const { conditionType, game, titleKeywords } = rule
      if (conditionType === 'game' || conditionType === 'both') {
        if (!game || !currentGame) return false
        if (currentGame.toLowerCase() !== game.toLowerCase()) return false
      }
      if (conditionType === 'title' || conditionType === 'both') {
        if (!titleKeywords || !currentStreamTitle) return false
        const keywords = titleKeywords.split(',').map(k => k.trim().toLowerCase()).filter(Boolean)
        if (!keywords.some(k => currentStreamTitle.toLowerCase().includes(k))) return false
      }
      return true
    }

    function resolveAutoTarget(target) {
      if (!target) return 'main'
      if (target.targetType === 'weighted') {
        const sets = (target.targetWeightedSets || []).filter(s => colQueues[s.collectionId]?.length > 0 && s.weight > 0)
        if (!sets.length) return 'main'
        const total = sets.reduce((s, w) => s + w.weight, 0)
        let rand = Math.random() * total
        for (const set of sets) { rand -= set.weight; if (rand <= 0) return set.collectionId }
        return sets[sets.length - 1].collectionId
      }
      return target.targetCollectionId || 'main'
    }

    function pickCollectionId() {
      if (playCfg.mode === 'auto') {
        for (const rule of (playCfg.autoRules || [])) {
          if (matchesRule(rule)) return resolveAutoTarget(rule)
        }
        return resolveAutoTarget(playCfg.autoFallback || { targetType: 'single', targetCollectionId: 'main' })
      }
      if (playCfg.mode !== 'weighted') {
        return playCfg.activeCollectionId || 'main'
      }
      const sets = (playCfg.weightedSets || []).filter(s => colQueues[s.collectionId]?.length > 0 && s.weight > 0)
      if (!sets.length) return 'main'

      const total = sets.reduce((s, w) => s + w.weight, 0)
      let rand = Math.random() * total
      for (const set of sets) {
        rand -= set.weight
        if (rand <= 0) return set.collectionId
      }
      return sets[sets.length - 1].collectionId
    }

    function weightedRandom(clips) {
      if (!clips || !clips.length) return null
      const { channelWeights = {} } = config
      const sw = getSelWeights()
      const popW       = (sw.popularity ?? 0) / 10
      const freshW     = (sw.clipFreshness ?? 0) / 10
      const distW      = (sw.respectDistribution ?? 0) / 10
      const gameMatchW = (sw.gameMatch ?? 0) / 10
      // Cooldown is always active, auto-derived from avoidReplays strength (min 12 min)
      const coolMs     = Math.max(1, sw.avoidReplays ?? 6) * 12 * 60000
      const hasCh      = Object.keys(channelWeights).length > 0

      const byChannel = {}
      for (const c of clips) {
        const ch = c.broadcaster_name || '';
        (byChannel[ch] = byChannel[ch] || []).push(c)
      }
      const activeChannels = Object.keys(byChannel).filter(ch => (channelWeights[ch] ?? 1) > 0)
      const filtered = clips.filter(c => activeChannels.includes(c.broadcaster_name || ''))
      const pool = filtered.length ? filtered : clips
      if (pool.length === 1) return pool[0]

      const totalChW = activeChannels.reduce((s, ch) => s + (channelWeights[ch] ?? 1), 0) || 1
      const clipPlayDur = c => Math.max(1, (c.trimEnd ?? c.duration ?? 60) - (c.trimStart ?? 0))
      const totalPoolDur = pool.reduce((s, c) => s + clipPlayDur(c), 0) || 1

      // Actual recent channel distribution for distribution balancing (by play time, not clip count)
      let recentActual = {}
      if (distW > 0 && recentChannelHistory.length >= 5) {
        const recent = recentChannelHistory.filter(h => h.time > Date.now() - coolMs)
        if (recent.length > 0) {
          for (const h of recent) recentActual[h.ch] = (recentActual[h.ch] || 0) + (h.dur || 60)
          const totalDur = Object.values(recentActual).reduce((s, v) => s + v, 0)
          for (const ch of Object.keys(recentActual)) recentActual[ch] /= totalDur
        }
      }

      const scored = pool.map(clip => {
        const ch = clip.broadcaster_name || ''
        const group = byChannel[ch] || [clip]
        const chW = channelWeights[ch] ?? 1
        const clipDur = clipPlayDur(clip)
        const groupDur = group.reduce((s, c) => s + clipPlayDur(c), 0) || 1
        let weight = hasCh ? (chW / totalChW) * (clipDur / groupDur) : clipDur / totalPoolDur

        if (popW > 0) {
          const max = Math.max(...group.map(c => c.view_count || 0))
          const norm = max > 0 ? (clip.view_count || 0) / max : 0.5
          weight *= (1 - popW) + popW * norm
        }

        if (freshW > 0) {
          const times = group.map(c => new Date(c.created_at || 0).getTime())
          const tmax = Math.max(...times), tmin = Math.min(...times)
          const t = new Date(clip.created_at || 0).getTime()
          const norm = tmax > tmin ? (t - tmin) / (tmax - tmin) : 0.5
          weight *= (1 - freshW) + freshW * norm
        }

        if (distW > 0 && Object.keys(recentActual).length > 0) {
          const target = chW / totalChW
          const actual = recentActual[ch] ?? 0
          const deficit = target - actual
          const factor = Math.max(0.1, Math.min(3.0, 1 + distW * 2 * (deficit / Math.max(target, 0.01))))
          weight *= factor
        }

        if (gameMatchW > 0 && currentGame) {
          if (clip.game_name?.toLowerCase() === currentGame.toLowerCase()) weight *= (1 + gameMatchW)
        }

        // Always-on replay penalty — strength scales with avoidReplays position
        const last = recentlyPlayed.get(clip.id)
        if (last !== undefined) {
          const age = Math.min(1, (Date.now() - last) / coolMs)
          weight *= Math.max(0.001, age)
        }

        return { clip, weight: Math.max(weight, 0.0001) }
      })

      const total = scored.reduce((s, w) => s + w.weight, 0)
      let rand = Math.random() * total
      for (const { clip, weight } of scored) { rand -= weight; if (rand <= 0) return clip }
      return scored[scored.length - 1].clip
    }

    function takeNextClip() {
      const colId = pickCollectionId()
      const effectiveId = colQueues[colId]?.length ? colId : 'main'
      const q = colQueues[effectiveId]
      if (!q || !q.length) return null

      const now = Date.now()
      const coolMs = Math.max(1, getSelWeights().avoidReplays ?? 6) * 12 * 60000
      for (const [id, ts] of recentlyPlayed) {
        if (now - ts > coolMs) recentlyPlayed.delete(id)
      }

      let clip
      if (!config.playAllBeforeLoop) {
        const available = q.filter(c => !recentlyPlayed.has(c.id))
        clip = weightedRandom(available.length ? available : q)
      } else {
        // Hard round-robin: no clip repeats until every clip in this collection
        // has played once. Set is persisted, so pauses/reloads don't reset it.
        let played = playedCycle[effectiveId] ||= new Set()
        let eligible = q.filter(c => !played.has(c.id))
        if (!eligible.length) {
          played.clear()
          eligible = q
        }
        clip = weightedRandom(eligible) || eligible[0]
      }

      // If no-consecutive-channel is on and this clip is from the same channel as what's playing, swap it out
      if (config.noConsecutiveChannel && activeClip?.broadcaster_name && clip?.broadcaster_name === activeClip.broadcaster_name) {
        const played = playedCycle[effectiveId]
        const filterFn = config.playAllBeforeLoop
          ? (c => c.broadcaster_name !== activeClip.broadcaster_name && !(played && played.has(c.id)))
          : (c => c.broadcaster_name !== activeClip.broadcaster_name && !recentlyPlayed.has(c.id))
        const fresh = q.filter(filterFn)
        const any   = q.filter(c => c.broadcaster_name !== activeClip.broadcaster_name)
        const alt   = weightedRandom(fresh.length ? fresh : (any.length ? any : null))
        if (alt) clip = alt
      }

      if (config.playAllBeforeLoop) {
        (playedCycle[effectiveId] ||= new Set()).add(clip.id)
        savePlayedCycle()
      }
      recentlyPlayed.set(clip.id, now)
      saveRecentlyPlayed()
      const dur = Math.max(1, (clip.trimEnd ?? clip.duration ?? 60) - (clip.trimStart ?? 0))
      recentChannelHistory.push({ ch: clip.broadcaster_name || '', time: now, dur })
      if (recentChannelHistory.length > 200) recentChannelHistory.splice(0, 100)
      clip._collectionId = effectiveId
      return clip
    }

    async function fetchUrl(clipId) {
      const res = await fetch(`${API}/api/clip-url/${clipId}`)
      const { url } = await res.json()
      if (!url) throw new Error('no url')
      return url
    }

    const MINOR_WORDS = new Set([
      'a','an','the','and','but','or','nor','for','yet','so',
      'at','by','in','of','on','to','up','as','via','per'
    ])

    function formatTitle(title) {
      if (!config.forceProper) return title
      const words = title.split(/(\s+)/)
      const tokens = words.filter(t => t.trim().length > 0)
      return words.map((token, _, arr) => {
        if (!token.trim()) return token
        const isFirst = token === tokens[0]
        const isLast  = token === tokens[tokens.length - 1]
        if (config.keepCaps && /[a-zA-Z]/.test(token) && token === token.toUpperCase()) return token
        const lower = token.charAt(0).toUpperCase() + token.slice(1).toLowerCase()
        const word  = token.replace(/[^a-zA-Z]/g, '').toLowerCase()
        if (!isFirst && !isLast && MINOR_WORDS.has(word)) return token.toLowerCase()
        return lower
      }).join('')
    }

    function updateClipInfoText(clip) {
      titleEl.textContent = config.showTitle ? formatTitle(clip.title || '') : ''
      const parts = []
      if (config.showBroadcaster && clip.broadcaster_name) parts.push(clip.broadcaster_name)
      if (config.showCreator && clip.creator_name)
        parts.push(`Clipped by <span class="creator">${clip.creator_name}</span>`)
      if (config.showViews && clip.view_count != null)
        parts.push(`${clip.view_count.toLocaleString()} views`)
      if (config.showDate && clip.created_at)
        parts.push(new Date(clip.created_at).toLocaleDateString())
      if (config.showDuration && clip.duration != null) {
        const m = Math.floor(clip.duration / 60)
        const s = Math.round(clip.duration % 60)
        parts.push(`${m}:${s.toString().padStart(2, '0')}`)
      }
      metaEl.innerHTML = parts.join(' &middot; ')
    }

    function showClipInfo(clip) {
      if (!config.showOverlay) return
      clearTimeout(overlayTimer)
      updateClipInfoText(clip)

      info.classList.remove('visible')
      requestAnimationFrame(() => requestAnimationFrame(() => {
        info.classList.add('visible')
        if (config.displayMode === 'timed') {
          overlayTimer = setTimeout(
            () => info.classList.remove('visible'),
            (config.displayDuration || 8) * 1000
          )
        }
      }))
    }

    function notifyNextClip(clip) {
      if (wsRef && wsRef.readyState === 1) {
        wsRef.send(JSON.stringify({ type: 'next-preloaded', clip: clip ?? null }))
      }
    }

    // Kick off preloading the NEXT clip into the inactive slot
    function schedulePreload() {
      if (!hasAnyClips()) { nextPreload = null; notifyNextClip(null); return }
      const clip = takeNextClip()
      if (!clip) { nextPreload = null; notifyNextClip(null); return }

      notifyNextClip(clip)
      const nextSlotIdx = 1 - activeSlot
      const nextVid = slots[nextSlotIdx].video

      nextPreload = fetchUrl(clip.id)
        .then(url => {
          nextVid.src = url
          nextVid.load()
          if (clip.trim_start != null) nextVid.currentTime = clip.trim_start
          nextVid.volume = 0
          return { clip, slotIdx: nextSlotIdx }
        })
        .catch(() => null)
    }

    function onClipEnded() {
      clearTimeout(overlayTimer)
      info.classList.remove('visible')
      activeCollectionId = null
      switchToPreloaded()
    }

    function getEnvelopeVol(envelope, time) {
      if (!envelope || envelope.length === 0) return 1.0
      const kfs = [...envelope].sort((a, b) => a.time - b.time)
      if (time <= kfs[0].time) return kfs[0].volume
      if (time >= kfs[kfs.length - 1].time) return kfs[kfs.length - 1].volume
      let i = 0
      while (i < kfs.length - 2 && kfs[i + 1].time <= time) i++
      const a = kfs[i], b = kfs[i + 1]
      if (b.mode === 'instant') return a.volume
      const p = (time - a.time) / (b.time - a.time)
      let t = p
      if (b.curve === 'ease-in')     t = p * p
      if (b.curve === 'ease-out')    t = 1 - (1 - p) * (1 - p)
      if (b.curve === 'ease-in-out') t = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2
      return a.volume + (b.volume - a.volume) * t
    }

    function attachClipListeners(video, clip) {
      let fired = false
      const hasEnvelope = clip.envelope && clip.envelope.length > 0
      function done() {
        if (fired) return
        fired = true
        if (clip.trim_end != null || hasEnvelope) video.removeEventListener('timeupdate', onTick)
        onClipEnded()
      }
      function onTick() {
        if (clip.trim_end != null && video.currentTime >= clip.trim_end) { done(); return }
        if (hasEnvelope) {
          const envVol = getEnvelopeVol(clip.envelope, video.currentTime)
          video.volume = Math.min(1, Math.max(0, baseVolume(clip) * envVol))
        }
      }
      video.addEventListener('ended', done, { once: true })
      video.addEventListener('error', done, { once: true })
      if (clip.trim_end != null || hasEnvelope) video.addEventListener('timeupdate', onTick)
    }

    async function switchToPreloaded() {
      const preloaded = await nextPreload
      nextPreload = null

      if (!preloaded) {
        await loadPlaybackConfig()
        begin()
        return
      }

      const { clip, slotIdx } = preloaded
      const nextSlot = slots[slotIdx]
      const prevSlot = slots[activeSlot]
      activeSlot = slotIdx

      // Instant crossfade — pause outgoing video so its audio stops
      nextSlot.wrap.classList.add('active')
      prevSlot.wrap.classList.remove('active')
      prevSlot.video.pause()

      // trim_start was already set during preload — do not re-seek here (causes audio desync)
      applyVolume(slotIdx, baseVolume(clip))
      if (clip.envelope?.length > 0) {
        const envVol = getEnvelopeVol(clip.envelope, clip.trim_start ?? 0)
        nextSlot.video.volume = Math.min(1, Math.max(0, baseVolume(clip) * envVol))
      }
      nextSlot.video.play().catch(() => {})

      activeClip = clip
      activeClipId = clip.id
      activeCollectionId = clip._collectionId
      notifyNowPlaying(clip)
      showClipInfo(clip)
      schedulePreload()
      attachClipListeners(nextSlot.video, clip)
    }

    async function begin() {
      if (!hasAnyClips()) {
        await loadPlaybackConfig()
        if (!hasAnyClips()) { setTimeout(begin, 10000); return }
      }

      activeCollectionId = null
      const clip = takeNextClip()
      if (!clip) return

      try {
        const url  = await fetchUrl(clip.id)
        const slot = slots[activeSlot]

        slot.video.src = url
        slot.video.load()
        slot.wrap.classList.add('active')
        if (clip.trim_start != null) {
          await new Promise(resolve => {
            slot.video.addEventListener('seeked', resolve, { once: true })
            slot.video.currentTime = clip.trim_start
          })
        }
        applyVolume(activeSlot, baseVolume(clip))
        if (clip.envelope?.length > 0) {
          const envVol = getEnvelopeVol(clip.envelope, clip.trim_start ?? 0)
          slot.video.volume = Math.min(1, Math.max(0, baseVolume(clip) * envVol))
        }
        await slot.video.play()

        activeClip = clip
        activeClipId = clip.id
        activeCollectionId = clip._collectionId
        notifyNowPlaying(clip)
        showClipInfo(clip)
        schedulePreload()

        attachClipListeners(slot.video, clip)
      } catch {
        setTimeout(begin, 2000)
      }
    }

    function notifyNowPlaying(clip) {
      if (wsRef && wsRef.readyState === 1) {
        wsRef.send(JSON.stringify({ type: 'now-playing', clipId: clip.id }))
      }
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    function connectWS() {
      const ws = new WebSocket('ws://localhost:1102')
      wsRef = ws
      ws.onopen  = () => tryBegin()
      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data)
          if (msg.type === 'queue-updated') loadPlaybackConfig()
          if (msg.type === 'collections-updated') loadPlaybackConfig()
          if (msg.type === 'playback-config-updated') {
            nextPreload = null   // cancel preloaded clip so next pick uses new config
            loadPlaybackConfig()
          }
          if (msg.type === 'config') applyConfig(msg.config)
          if (msg.type === 'stop') {
            colQueues = {}; colIndices = {}; nextPreload = null; activeCollectionId = null
            slots.forEach(s => { s.video.pause(); s.video.src = '' })
          }
          if (msg.type === 'volume-update' && msg.clipId === activeClipId) {
            applyVolume(activeSlot, msg.volume)
          }
          if (msg.type === 'skip-next') {
            nextPreload = null
            schedulePreload()
          }
        } catch {}
      }
      ws.onclose = () => { wsRef = null; setTimeout(connectWS, 3000) }
      ws.onerror = () => ws.close()
    }

    function tryBegin() {
      if (started || document.hidden) return
      started = true
      begin()
    }

    // OBS browser sources expose window.obsstudio and include 'OBS' in the UA.
    // Electron BrowserWindows include 'Electron' in the UA (reliable even with contextIsolation).
    // Browser tabs get neither — they must not auto-play.
    const isOBS = typeof window.obsstudio !== 'undefined' || /OBS/i.test(navigator.userAgent)
    const isElectron = /Electron/i.test(navigator.userAgent)

    if (isElectron) {
      slots.forEach(s => { s.video.muted = true; s.video.pause() })
    } else if (isOBS) {
      connectWS()
      setTimeout(tryBegin, 1500)
      fetchCurrentGame()
      setInterval(fetchCurrentGame, 60000)
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        slots.forEach(s => s.video.pause())
      } else {
        if (!started) tryBegin()
        else slots[activeSlot].video.play().catch(() => {})
      }
    })
  </script>
</body>
</html>
