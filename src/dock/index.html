<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Shiny Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0e0e10; overflow: hidden; }
    #canvas-wrap { position: relative; width: 100%; height: 100%; }
    .tile {
      position: absolute;
      background: #1f1f23;
      border: 2px solid #2d2d35;
      border-radius: 4px;
      color: #efeff1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 8px;
      overflow: hidden;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .tile:hover  { background: #26262c; border-color: #4a4a5a; }
    .tile.active { background: #1f1030; border-color: #9147ff; box-shadow: 0 0 0 1px #9147ff; }
    .tile.disconnected { opacity: 0.5; cursor: default; pointer-events: none; }
    #empty-msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #adadb8; font-size: 13px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <script>
    const PAD = 6
    let state = { layout: null, currentScene: null, currentDeviceId: null }
    let connected = false

    function render() {
      const wrap = document.getElementById('canvas-wrap')
      const positions = state.layout?.positions ?? []
      const tiles = positions.filter(p => p.device)

      if (!state.layout || tiles.length === 0) {
        wrap.innerHTML = '<div id="empty-msg">No layout configured.<br>Set one up in Quick Shiny Screen.</div>'
        return
      }

      // Compute bounding box of tile system in layout % coords
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity
      for (const p of tiles) {
        const w = p.w ?? 45, h = p.h ?? 45
        if (p.x - w/2 < minX) minX = p.x - w/2
        if (p.x + w/2 > maxX) maxX = p.x + w/2
        if (p.y - h/2 < minY) minY = p.y - h/2
        if (p.y + h/2 > maxY) maxY = p.y + h/2
      }
      const bw = maxX - minX || 1
      const bh = maxY - minY || 1

      // Available dock space after padding
      const dw = wrap.clientWidth  - PAD * 2
      const dh = wrap.clientHeight - PAD * 2

      wrap.innerHTML = ''
      for (const pos of tiles) {
        const w = pos.w ?? 45, h = pos.h ?? 45
        const el = document.createElement('div')
        let className = 'tile'
        if (pos.deviceId === state.currentDeviceId) className += ' active'
        if (!connected) className += ' disconnected'
        el.className = className
        // Map tile edges from layout bounding-box space → px in dock, using right-edge calculation
        // to ensure adjacent tiles share exactly the same pixel edge (prevents sub-pixel gaps)
        const tileLeft   = Math.round(PAD + (pos.x - minX - w/2) / bw * dw)
        const tileTop    = Math.round(PAD + (pos.y - minY - h/2) / bh * dh)
        const tileRight  = Math.round(PAD + (pos.x - minX + w/2) / bw * dw)
        const tileBottom = Math.round(PAD + (pos.y - minY + h/2) / bh * dh)
        el.style.left   = tileLeft + 'px'
        el.style.top    = tileTop + 'px'
        el.style.width  = (tileRight - tileLeft) + 'px'
        el.style.height = (tileBottom - tileTop) + 'px'
        el.dataset.deviceId = pos.deviceId
        el.textContent = pos.device.name
        el.addEventListener('click', () => {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'show-device', deviceId: pos.deviceId, shinyScene: state.layout?.shinyScene }))
        })
        wrap.appendChild(el)
      }
    }

    function updateActive() {
      document.querySelectorAll('.tile').forEach(el => {
        el.classList.toggle('active', el.dataset.deviceId === state.currentDeviceId)
      })
    }

    // Re-render when dock is resized
    new ResizeObserver(render).observe(document.getElementById('canvas-wrap'))

    let ws
    let fetchRetryTimeout

    function setCached(data) {
      localStorage.setItem('dockState', JSON.stringify(data))
    }

    function getCached() {
      try {
        return JSON.parse(localStorage.getItem('dockState') || 'null')
      } catch {
        return null
      }
    }

    function setConnected(status) {
      if (connected !== status) {
        connected = status
        render()
      }
    }

    function connect() {
      ws = new WebSocket('ws://localhost:1102/dock')
      ws.onopen = () => setConnected(true)
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data)
          if (msg.type === 'hello') {
            state.layout          = msg.layout          ?? state.layout
            state.currentScene    = msg.currentScene    ?? state.currentScene
            state.currentDeviceId = msg.currentDeviceId ?? state.currentDeviceId
            setCached(state)
            render()
          }
          if (msg.type === 'layout-changed') { state.layout = msg.layout; setCached(state); render() }
          if (msg.type === 'scene-changed') {
            state.currentScene = msg.sceneName
            if (msg.layout !== undefined) { state.layout = msg.layout; setCached(state); render() }
          }
          if (msg.type === 'device-shown') { state.currentDeviceId = msg.deviceId; setCached(state); updateActive() }
        } catch {}
      }
      ws.onclose = () => { setConnected(false); setTimeout(connect, 1000) }
      ws.onerror = () => {}
    }

    function fetchState() {
      fetch('/api/shiny/state').then(r => r.json()).then(data => {
        state.layout = data.layout
        state.currentScene = data.currentScene
        state.currentDeviceId = data.currentDeviceId
        setCached(state)
        setConnected(true)
        render()
      }).catch(() => {
        fetchRetryTimeout = setTimeout(fetchState, 1000)
      })
    }

    // Try to load from cache first
    const cached = getCached()
    if (cached) {
      state.layout = cached.layout
      state.currentScene = cached.currentScene
      state.currentDeviceId = cached.currentDeviceId
    }
    setConnected(false)
    render()

    connect()
    fetchState()
  </script>
</body>
</html>
